# Bot de comunidad: cada hora contesta comentarios y, 12-24 h después de cada test, publica la solución
# (Instagram, TikTok y LinkedIn). Ver comunidad.py. Se apaga con la variable COMUNIDAD = false.
name: Comunidad

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo enseñar lo que haría (no publica nada)"
        type: boolean
        default: false
      primera_hora:
        description: "Primera hora de un reel: 4 pasadas, una cada 15 min (lo lanza el reel al publicarse)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: comunidad
  cancel-in-progress: false

jobs:
  comunidad:
    if: vars.ACTIVO == 'true' && vars.COMUNIDAD != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: timeout 300 pip install --prefer-binary --timeout 20 -q requests pillow numpy
      - name: Contestar comentarios y publicar soluciones
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_MATCH: ${{ vars.ZERNIO_MATCH || 'uniondearquitectos' }}
          ZERNIO_IG_ACCOUNT: ${{ vars.ZERNIO_IG_ACCOUNT }}
          ZERNIO_TT_ACCOUNT: ${{ vars.ZERNIO_TT_ACCOUNT }}
          ZERNIO_LI_ACCOUNT: ${{ vars.ZERNIO_LI_ACCOUNT }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@uniondearquitectos' }}
          COMUNIDAD_DEBUG: ${{ inputs.prueba && '1' || '' }}
        run: |
          if [ "${{ inputs.primera_hora }}" = "true" ]; then
            for i in 1 2 3 4; do python comunidad.py | tee -a comunidad.log; [ $i -lt 4 ] && sleep 900; done
          else
            python comunidad.py ${{ inputs.prueba && '--prueba' || '' }} | tee comunidad.log
          fi
      - name: Guardar el estado
        if: always()
        run: python sincronizar.py "Comunidad $(date +%F-%H)" comunidad.json comunidad_estado.md comunidad.log
