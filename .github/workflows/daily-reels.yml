name: Reels diarios

on:
  schedule:
    # Publica a las 8:00, 12:00 y 15:00 hora de España: arranca 45 min antes y espera a la hora exacta para publicar.
    # Un cron por hueco y estación: el hueco sale del cron (no de la hora a la que GitHub lo lanza, que a veces se
    # retrasa horas). En marzo y octubre corren los dos juegos y "Elegir hueco" descarta el de la otra estación.
    - cron: "15 5 * 3-10 *"      # verano · mañana
    - cron: "15 9 * 3-10 *"      # verano · mediodía
    - cron: "15 12 * 3-10 *"     # verano · tarde
    - cron: "15 6 * 1-3,10-12 *"   # invierno · mañana
    - cron: "15 10 * 1-3,10-12 *"  # invierno · mediodía
    - cron: "15 13 * 1-3,10-12 *"  # invierno · tarde
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato (auto = lo elige el piloto automático)"
        type: choice
        options: [auto, infografia, caso_coste, comparativa, mito_realidad, grafico, dato, claves, caso_despacho]
        default: auto
      estilo:
        description: "Estilo visual (auto = lo elige el piloto automático)"
        type: choice
        options: [auto, negro, piedra, carbon, plano, ficha, minimal, ilustrado]
        default: auto
      variante:
        description: "Tipo de infografía (auto = el que toca según el día)"
        type: choice
        options: [auto, caso, contratar, delegable, tiempo, proceso, testimonio]
        default: auto
      publicar_a:
        description: "Hora de publicación (HH:MM, hora de España). Vacío = en cuanto esté listo"
        default: ""
      dry_run:
        description: "Solo generar el vídeo (no publicar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120    # varios formatos si alguno no llega al 8 (+ espera a la hora de publicar)
    steps:
      - name: Elegir hueco
        id: slot
        run: |
          S="${{ github.event.schedule }}"
          if [ -z "$S" ]; then echo "slot=manual" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ vars.ACTIVO }}" != "true" ]; then echo "slot=skip" >> "$GITHUB_OUTPUT"; echo "Piloto apagado: pon la variable ACTIVO = true"; exit 0; fi
          OFF=$(TZ=Europe/Madrid date +%z)                         # +0200 verano, +0100 invierno
          case "$S" in
            "15 5 "*|"15 9 "*|"15 12 "*) SEASON="+0200" ;;
            *) SEASON="+0100" ;;
          esac
          if [ "$OFF" != "$SEASON" ]; then echo "slot=skip" >> "$GITHUB_OUTPUT"; echo "Cron de la otra estación: no toca"; exit 0; fi
          case "$S" in
            "15 5 "*|"15 6 "*)   echo "slot=manana" >> "$GITHUB_OUTPUT" ;;
            "15 9 "*|"15 10 "*)  echo "slot=mediodia" >> "$GITHUB_OUTPUT" ;;
            *)                   echo "slot=tarde" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Hueco: $S (aunque GitHub lo lance con retraso, se publica igual)"

      - uses: actions/checkout@v5
        if: steps.slot.outputs.slot != 'skip'

      - uses: actions/setup-python@v6
        if: steps.slot.outputs.slot != 'skip'
        with:
          python-version: "3.11"
          cache: pip

      - name: Paquetes del sistema
        if: steps.slot.outputs.slot != 'skip'
        run: command -v ffmpeg >/dev/null && command -v espeak-ng >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng)

      - name: Paquetes de Python
        if: steps.slot.outputs.slot != 'skip'
        run: pip install -r requirements.txt

      - name: Caché de modelos de voz y subtítulos
        if: steps.slot.outputs.slot != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voces-es-uda-v1

      - name: Voz de respaldo (Kokoro)
        if: steps.slot.outputs.slot != 'skip'
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          P=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          [ -f models/es_ES-davefx-medium.onnx ] || curl -sSL -o models/es_ES-davefx-medium.onnx $P/es_ES-davefx-medium.onnx
          [ -f models/es_ES-davefx-medium.onnx.json ] || curl -sSL -o models/es_ES-davefx-medium.onnx.json $P/es_ES-davefx-medium.onnx.json

      - name: Generar y publicar
        if: steps.slot.outputs.slot != 'skip'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_IDS: ${{ vars.ELEVENLABS_VOICE_IDS }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ZERNIO_MATCH: ${{ vars.ZERNIO_MATCH || 'uniondearquitectos' }}
          ZERNIO_IG_ACCOUNT: ${{ vars.ZERNIO_IG_ACCOUNT }}
          ZERNIO_TT_ACCOUNT: ${{ vars.ZERNIO_TT_ACCOUNT }}
          ZERNIO_LI_ACCOUNT: ${{ vars.ZERNIO_LI_ACCOUNT }}
          LINKEDIN_ORG_URN: ${{ vars.LINKEDIN_ORG_URN }}
          VOICE_ENGINE: gemini
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Orus' }}
          FORMAT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.formato || 'auto' }}
          STYLE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.estilo || 'auto' }}
          IG_VARIANTE: ${{ github.event_name == 'workflow_dispatch' && inputs.variante != 'auto' && inputs.variante || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@uniondearquitectos' }}
          IG_STORY: ${{ vars.IG_STORY || 'true' }}
          TIKTOK: ${{ vars.TIKTOK || 'true' }}
          TIKTOK_STORY_BORRADOR: ${{ vars.TIKTOK_STORY_BORRADOR || 'false' }}
          LINKEDIN: ${{ vars.LINKEDIN || 'carrusel' }}
          PUBLISH_MAX_WAIT_MIN: ${{ vars.PUBLISH_MAX_WAIT_MIN || '50' }}
          PUBLISH_AT_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar_a || '' }}
        run: python run_daily.py ${{ steps.slot.outputs.slot }}

      - name: Guardar el vídeo para revisarlo
        if: always() && steps.slot.outputs.slot != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.slot.outputs.slot }}
          path: out/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Recordar piezas usadas, verificaciones y aprendizajes
        if: always() && steps.slot.outputs.slot != 'skip'
        run: python sincronizar.py "Reel ${{ steps.slot.outputs.slot }} $(date +%F)" used.json log.jsonl review_log.jsonl performance.json strategy_arms.json strategy_report.md playbook.md banco/verificacion.json image_log.jsonl errores_reels.log tiempos.log agents
